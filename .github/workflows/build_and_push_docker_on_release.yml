name: Build & Push docker images

on:
  release:
    types:
      - released

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Output GitHub tag example
        run: |
          echo "Tag name: ${{ github.ref_name }}"

      - name: Set container image version
        run: echo "CONTAINER_IMAGE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: echo CONTAINER_IMAGE_VERSION
        run: |
          echo "CONTAINER_IMAGE_VERSION: $CONTAINER_IMAGE_VERSION"

      - name: Set full image registry tag
        run: echo "FULL_COMPETITIVE_MAPPING_IMAGE_TAG=lhr.ocir.io/lrbvkel2wjot/gpas/competitivemapping_pipeline:$CONTAINER_IMAGE_VERSION" >> $GITHUB_ENV

      - name: Echo full image registry tag
        run: |
          echo "FULL_COMPETITIVE_MAPPING_IMAGE_TAG: $FULL_COMPETITIVE_MAPPING_IMAGE_TAG"

      - name: Login to OCR
        uses: docker/login-action@v2
        with:
          registry: lhr.ocir.io
          username: ${{ secrets.OCR_USERNAME }}
          password: ${{ secrets.OCR_TOKEN }}

      - name: Build and push
        id: build_and_push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: Dockerfile
          tags: |
            ${{ env.FULL_COMPETITIVE_MAPPING_IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.FULL_COMPETITIVE_MAPPING_IMAGE_TAG }}
          cache-to: type=inline
