name: Bump and Build

on:
  push:
    branches:
      - main

env:
  REGISTRY: lhr.ocir.io
  IMAGE_NAME: lrbvkel2wjot/gpas/competitivemapping_pipeline
  IMAGE_NAME_GPAS_LTD: lr3yhdniv6gu/competitivemapping_pipeline

jobs:
  bump-version:
    if: ${{ ! startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest
    permissions: write-all # Needed for automatic release
    name: "Bump version and create changelog with commitizen"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create bump and changelog
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
        # This step will add an environment variable REVISION with the new version
      - name: echo new version
        run: |
          echo "$REVISION"

      - name: Login to OCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY}}
          username: ${{ secrets.OCR_USERNAME }}
          password: ${{ secrets.OCR_TOKEN }}

      - name: Set full image registry tag
        run: |
          echo "FULL_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$REVISION" >> $GITHUB_ENV

      - name: Build and push
        id: build_and_push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: Dockerfile
          tags: |
            ${{ env.FULL_IMAGE_TAG }}

      - name: Login to gpasltd OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCR_CONTAINER_USERNAME_GPASLTD }}
          password: ${{ secrets.OCR_CONTAINER_TOKEN_GPASLTD }}

      - name: Set full image registry tag
        run: |
          echo "FULL_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GPAS_LTD }}:$REVISION" >> $GITHUB_ENV

      - name: Build and push
        id: build_and_push_gpas_ltd
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: Dockerfile
          tags: |
            ${{ env.FULL_IMAGE_TAG }}

      - name: Docker digest
        run: echo ${{ steps.build_and_push.outputs.digest }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          tag_name: ${{ env.REVISION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
