name: Build and push Docker images
#Based on the docker build action for FN5
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set / mock release version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: mock release version
        run: echo "RELEASE_VERSION=v0.0.0" >> $GITHUB_ENV
      - name: Login to OCR
        uses: docker/login-action@v2 
        with:
          registry: lhr.ocir.io
          username: ${{ secrets.OCR_USERNAME }}
          password: ${{ secrets.OCR_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          file: Dockerfile
          tags: |
            lhr.ocir.io/lrbvkel2wjot/gpas/competitivemapping_pipeline:latest
            lhr.ocir.io/lrbvkel2wjot/gpas/competitivemapping_pipeline:${{env.RELEASE_VERSION}}
          push: true
          no-cache: true
      - name: Docker digest
        run: echo ${{ steps.docker_build.outputs.digest }}