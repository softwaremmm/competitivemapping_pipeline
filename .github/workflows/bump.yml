name: Bump Version based on commit hash

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to bump version on'
        required: true
        default: 'develop'

jobs:
  bump:
    # Determine branch from workflow_dispatch input when present, otherwise use the ref name.
    env:
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || 'develop' }}
    # Only run when not operating on main and when the triggering commit message does not start with "bump:".
    if: ${{ env.BRANCH != 'main' && !startsWith(github.event.head_commit.message || '', 'bump:') }}
    runs-on: ubuntu-latest
    permissions: write-all # Needed for automatic release
    name: "Bump version and create changelog with commitizen"
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install .[dev]

      - name: Get Short Commit SHA
        id: get-commit-hash
        run: echo "COMMIT_HASH=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_ENV

      - name: bump version with hash
        id: bump
        run: |
          source venv/bin/activate

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          bumper version
          bumper bump --active --no-tag ${{ env.COMMIT_HASH }}
          echo "version=$(bumper version --active)" >> $GITHUB_OUTPUT

      - name: push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          tags: true
          branch: ${{ env.BRANCH }}

  build_container:
    needs: bump
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build_and_push_container.yml
    with:
      tag: ${{ needs.bump.outputs.version }}
    secrets: inherit
