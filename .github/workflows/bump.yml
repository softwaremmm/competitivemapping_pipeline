name: Bump Version based on commit hash
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to bump version on'
        required: true

jobs:
  bump:
    env:
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
    if: ${{ ! startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest
    permissions: write-all # Needed for automatic release
    name: "Bump version and trigger container build"
    outputs:
      ref: ${{ steps.step_longhash.outputs.COMMIT_HASH_LONG }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install .[dev]

      - name: Get Commit Short SHA
        id: get-commit-hash
        run: |
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          
      - name: Bump version with hash
        id: bump
        run: |
          source venv/bin/activate
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          bumper version
          bumper bump --active --no-tag ${{ env.COMMIT_HASH }}
          echo "VERSION=$(bumper version --active)" >> $GITHUB_ENV                 

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          tags: true
          branch: ${{ env.BRANCH }}

      - name: Get long hash
        id: step_longhash
        run: |
          git checkout ${{ env.VERSION }}
          echo "COMMIT_HASH_LONG=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT 

  build_container:
    needs: bump
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build_and_push_container.yml
    with:
      ref: ${{ needs.bump.outputs.ref }}
    secrets: inherit
