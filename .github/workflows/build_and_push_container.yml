name: Build and Push Container

on:
  push:
    tags:
      - '*.*.*'
      - '*.*.*-rc*'
      - '*.*.*\+*'
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
        default: 'develop'

env:
  REGISTRY: lhr.ocir.io
  IMAGE_NAME: lrbvkel2wjot/gpas/competitivemapping_pipeline
  IMAGE_NAME_GPAS_LTD: lr3yhdniv6gu/gpas/competitivemapping_pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build docker containers"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Determine the tag to use
        id: image-tag
        run: |
          if [[ -n "${{ inputs.ref }}" ]]; then
            echo "reference=${{ inputs.ref }}" >> $GITHUB_ENV
          else
            echo "reference=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Determine short SHA, if long SHA passed as reference
        id: sha
        run: |
          REF="${{ env.reference }}"
          if [[ ${#REF} -eq 40 ]]; then
            SHORT_SHA=$(git rev-parse --short "$REF")
            echo "Short SHA: $SHORT_SHA"
            echo "tag=$SHORT_SHA" >> $GITHUB_ENV
          else
            echo "Input is not a full SHA, skipping conversion."
            echo "tag=$REF" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to OCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCR_USERNAME }}
          password: ${{ secrets.OCR_TOKEN }}

      - name: Set full image registry tag
        run: |
          echo "FULL_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.tag }}" >> $GITHUB_ENV
          echo "FULL_IMAGE_TAG: ${{ env.FULL_IMAGE_TAG }}"

      - name: Build and push
        id: build_and_push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: Dockerfile
          tags: |
            ${{ env.FULL_IMAGE_TAG }}

      - name: Login to gpasltd OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCR_CONTAINER_USERNAME_GPASLTD }}
          password: ${{ secrets.OCR_CONTAINER_TOKEN_GPASLTD }}

      - name: Set full image registry tag for gpasltd
        run: |
          echo "FULL_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GPAS_LTD }}:${{ env.tag }}" >> $GITHUB_ENV
          echo "FULL_IMAGE_TAG: ${{ env.FULL_IMAGE_TAG }}"

      - name: Build and push
        id: build_and_push_gpasltd
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: Dockerfile
          tags: |
            ${{ env.FULL_IMAGE_TAG }}
