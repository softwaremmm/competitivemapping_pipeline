name: Rust Test

on:
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Print versions
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Run clippy
        working-directory: ./tie_break
        run: cargo clippy --all --all-features --tests -- -D warnings

      - name: install samtools
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools
          samtools --version

      - name: Run tests
        working-directory: ./tie_break
        run: cargo test
