[build-system]
requires = ["setuptools~=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "competitivemapping_pipeline"
description = "Calls mycobacterial species by Competitive Mapping."
dependencies = [
    "pandas~=2.2.0",
    "jsonschema~=4.19",
    "pysam~=0.22",
    "pyarrow~=15.0",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = "~=3.11"
version = "3.0.1"

[project.scripts]
process_coverage = "competitivemapping.process_coverage:cli_entry_point"
process_aln_stats = "competitivemapping.process_aln_stats:cli_entry_point"
check_read_count = "competitivemapping.check_read_count:cli_entry_point"
competitive_mapping = "competitivemapping.competitive_mapping:cli_entry_point"
manifest_builder = "competitivemapping.manifest_builder:cli_entry_point"
manifest_builder_manual = "competitivemapping.manifest_builder_manual:cli_entry_point"
manifest_mapper = "competitivemapping.manifest_mapper:cli_entry_point"
extract_reads = "competitivemapping.extract_reads:cli_entry_point"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-mock",
    "black",
    "pre-commit",
    "commitizen",
    "pylint",
    "mypy",
    "pandas-stubs",
    "types-jsonschema",
    "version_bumper @ git+https://github.com/GlobalPathogenAnalysisService/version_bumper.git",
]
docs = ["json-schema-for-humans"]

[tool.setuptools.package-data]
competitivemapping = ["*.json"]

[tool.commitizen]
name = "cz_conventional_commits"
bump_message = "bump: version $current_version → $new_version"
update_changelog_on_bump = false
version_type = "semver"
version_provider = "pep621"
tag_format = "$version"


[tool.version_bumper]
active_version = "e9afb2e"
version_files = [
    "process/competitive_mapping.nf",
]

[tool.black]
line-length = 120

[tool.pylint]
max-line-length = 120
