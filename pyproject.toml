[build-system]
requires = ["setuptools~=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "competitivemapping_pipeline"
description = "Calls mycobacterial species by Competitive Mapping."
dependencies = ["pandas ~=2.0", "jsonschema~=4.19"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = "~=3.11"
version = "0.6.0"

[project.scripts]
process_mapping = "competitivemapping.process_mapping:cli_entry_point"

[project.optional-dependencies]
release = ["commitizen"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-mock",
    "black",
    "pre-commit",
    "pylint",
    "mypy",
    "pandas-stubs",
    "types-jsonschema",
]
docs = ["json-schema-for-humans"]

[tool.setuptools.package-data]
competitivemapping = ["*.json"]

[tool.commitizen]
name = "cz_conventional_commits"
bump_message = "version $current_version → $new_version" #[skip ci]
version_type = "semver"
version_provider = "pep621"
tag_format = "$version"
version_files = [
    "process/competitive_mapping.nf",
    ".github/workflows/docker.yaml",
]

[tool.black]
line-length = 120

[tool.pylint]
max-line-length = 120
